apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://host.minikube.internal/risk-assistant.git
    targetRevision: HEAD
    path: infra/kubernetes/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
