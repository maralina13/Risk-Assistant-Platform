apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-assistant
  namespace: risk-assistant
  annotations:
    haproxy.org/timeout-client: 30s
    haproxy.org/timeout-server: 30s
spec:
  ingressClassName: haproxy
  rules:
    - host: risk-assistant.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8088
