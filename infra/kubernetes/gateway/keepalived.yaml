apiVersion: v1
kind: ConfigMap
metadata:
  name: keepalived-config
  namespace: platform
data:
  keepalived.conf: |
    vrrp_instance VI_1 {
      state BACKUP
      interface eth0
      virtual_router_id 51
      priority 100
      advert_int 1
      authentication {
        auth_type PASS
        auth_pass risklab
      }
      virtual_ipaddress {
        192.168.49.240/24
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: keepalived
  namespace: platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keepalived
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keepalived
    spec:
      hostNetwork: true
      containers:
        - name: keepalived
          image: osixia/keepalived:2.0.20
          command:
            - keepalived
            - -n
            - -l
            - -f
            - /etc/keepalived/keepalived.conf
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_BROADCAST", "NET_RAW"]
          volumeMounts:
            - name: config
              mountPath: /etc/keepalived/keepalived.conf
              subPath: keepalived.conf
      volumes:
        - name: config
          configMap:
            name: keepalived-config
