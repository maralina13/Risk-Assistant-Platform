apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/namespaces.yaml
  - ../../cluster/cluster-autoscaler.yaml
  - ../../gateway/haproxy-ingress.yaml
  - ../../gateway/keepalived.yaml
  - ../../gateway/rate-limit.yaml
  - ../../mesh/istio-policies.yaml
  - ../../ci/local-registry.yaml
patches:
  - target:
      kind: Ingress
      name: risk-assistant
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: risk-assistant.local
