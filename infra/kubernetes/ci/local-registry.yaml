apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-registry
  namespace: cicd
  labels:
    app.kubernetes.io/name: cicd-registry
    app.kubernetes.io/part-of: risk-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cicd-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cicd-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-registry
  namespace: cicd
  labels:
    app.kubernetes.io/name: cicd-registry
    app.kubernetes.io/part-of: risk-assistant
spec:
  selector:
    app.kubernetes.io/name: cicd-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
